<style>
/* Una sola pantalla para proyectar: dos tarjetas grandes con dibujo y palabra, botón ¿Riman? y la respuesta con un niño
   que brinca o se queda quieto. Look claro único (para proyector), con lila de la biblioteca y rojo de las mayúsculas. */
:root {
  --bg: #F4F0FF;
  --tarjeta: #FFFFFF;
  --tinta: #2E2350;
  --lila: #B79CF0;
  --lila-osc: #6B45C6;
  --rojo: #E1262D;
  --si: #1E9B55;
  --si-suave: #D9F4E4;
  --no: #2F72D6;
  --no-suave: #E0ECFC;
  --sol: #FFC93C;
  --naranja: #F08A24;
  --sombra: 0 6px 0 #DCD0FA;
  --f: "Mali", "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
.iconos { display: flex; gap: 10px; }
a.icono { color: inherit; text-decoration: none; }
body { background: var(--bg); color: var(--tinta); font-family: var(--f); font-weight: 700; overflow-x: hidden; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 4px solid var(--lila-osc); outline-offset: 4px; }
.app { height: 100%; display: flex; flex-direction: column; gap: clamp(8px, 1.6vh, 18px);
  padding-block: clamp(10px, 2vh, 22px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* encabezado */
.cab { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; }
.cab h1 { margin: 0; font-size: clamp(26px, 4.2vh, 46px); line-height: 1.05; background: var(--tarjeta); border: 4px solid var(--lila); border-radius: 999px; padding: 6px 26px 10px; box-shadow: var(--sombra); }
.cab h1 .q { color: var(--rojo); }
.puntos { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.punto { width: 18px; height: 18px; border-radius: 50%; background: var(--tarjeta); border: 3px solid var(--lila); }
.punto.hecho { background: var(--lila); }
.punto.actual { background: var(--sol); border-color: var(--naranja); transform: scale(1.25); }
.punto.estrella { border-radius: 4px; transform: rotate(45deg); }
.icono { width: 52px; height: 52px; border-radius: 16px; border: 4px solid var(--lila); background: var(--tarjeta); display: grid; place-items: center; box-shadow: var(--sombra); }
.icono svg { width: 24px; height: 24px; }

/* escenario */
.escena { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: clamp(8px, 2vw, 28px); }
.carta { background: var(--tarjeta); border: 6px solid var(--lila); border-radius: 36px; box-shadow: var(--sombra); padding: clamp(10px, 2vh, 22px) 12px clamp(8px, 1.6vh, 16px);
  display: flex; flex-direction: column; align-items: center; gap: clamp(4px, 1vh, 10px); min-width: 0; height: 100%; max-height: 100%; justify-content: center; transition: transform .15s ease; }
.carta:hover { transform: translateY(-4px); }
.carta.habla { animation: rebote .45s ease; }
@keyframes rebote { 0%, 100% { transform: none; } 40% { transform: scale(1.05) rotate(-2deg); } }
.carta svg { width: min(100%, 44vh); height: auto; aspect-ratio: 1; max-height: 100%; flex: 0 1 auto; min-height: 0; }
.palabra { font-size: clamp(40px, min(7vw, 10vh), 104px); line-height: 1.2; letter-spacing: .02em; padding-bottom: 4px; }
.fin { border-radius: 14px; padding: 0 4px; transition: background .2s ease, color .2s ease; }
.si .fin { background: var(--si-suave); color: var(--si); box-shadow: inset 0 -6px 0 #A9E5C2; }
.no .carta.a .fin { background: #FFE6CC; color: #C25E00; box-shadow: inset 0 -6px 0 #FFC98F; }
.no .carta.b .fin { background: var(--no-suave); color: var(--no); box-shadow: inset 0 -6px 0 #B3D0F7; }
.y { font-size: clamp(30px, 5vh, 54px); color: var(--lila-osc); }
.oye { font-size: clamp(14px, 2vh, 18px); color: var(--lila-osc); display: flex; align-items: center; gap: 6px; }
.oye svg { width: 20px; height: 20px; aspect-ratio: auto; }

/* acciones y respuesta */
.pie { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; min-height: clamp(84px, 15vh, 150px); }
.btn { border: 0; border-radius: 26px; padding: 14px 34px 18px; font-size: clamp(24px, 4vh, 40px); box-shadow: 0 6px 0 rgba(0, 0, 0, .18); }
.btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0, 0, 0, .18); }
.btn.riman { background: var(--sol); color: var(--tinta); }
.btn.sig { background: var(--lila-osc); color: #FFFFFF; }
.btn.chico { font-size: clamp(16px, 2.4vh, 22px); padding: 10px 18px 12px; background: var(--tarjeta); border: 4px solid var(--lila); box-shadow: var(--sombra); }
.respuesta { display: flex; align-items: center; gap: 12px; background: var(--tarjeta); border-radius: 30px; padding: 6px 26px 6px 10px; box-shadow: var(--sombra); border: 5px solid var(--si); }
.respuesta.no { border-color: var(--no); }
.respuesta svg { width: clamp(80px, 15vh, 140px); height: auto; }
.respuesta .txt { font-size: clamp(26px, 4.6vh, 50px); line-height: 1.05; color: var(--si); }
.respuesta.no .txt { color: var(--no); }
.respuesta small { display: block; font-size: .55em; color: var(--tinta); margin-top: 4px; }
.brinca { animation: brinco .7s ease-in-out infinite; transform-origin: 100px 220px; }
.sombra { animation: sombra .7s ease-in-out infinite; transform-origin: 100px 228px; }
@keyframes brinco { 0%, 100% { transform: translateY(6px) scaleY(.96); } 50% { transform: translateY(-26px); } }
@keyframes sombra { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(.7); opacity: .7; } }

/* cierre */
.final { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(8px, 2vh, 20px); text-align: center; }
.final svg { width: min(60vw, 40vh); height: auto; }
.final h2 { margin: 0; font-size: clamp(30px, 6vh, 64px); line-height: 1.1; }
.final h2 .q { color: var(--rojo); }
.reloj { font-size: clamp(30px, 6vh, 60px); font-variant-numeric: tabular-nums; min-width: 4ch; }
.fila { display: flex; gap: 14px; align-items: center; justify-content: center; flex-wrap: wrap; }

@media (max-width: 640px) {
  .escena { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .y { display: none; }
  .carta { border-radius: 24px; }
}
@media (prefers-reduced-motion: reduce) {
  .brinca, .sombra, .carta.habla { animation: none; }
  .carta, .btn { transition: none; }
}
</style>
</head>
<body>
<div class="app">
  <header class="cab">
    <h1>¿<span class="q">R</span>iman o no riman?</h1>
    <div class="puntos" id="puntos" aria-label="Avance"></div>
    <div class="iconos">
      <a class="icono" href="../" aria-label="Todas las actividades" title="Todas las actividades">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg>
      </a>
      <button class="icono" id="btnPantalla" type="button" aria-label="Pantalla completa" title="Pantalla completa">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
  </header>

  <main class="escena" id="escena" aria-live="polite">
    <button class="carta a" id="cartaA" type="button"></button>
    <div class="y" aria-hidden="true">y</div>
    <button class="carta b" id="cartaB" type="button"></button>
  </main>

  <section class="final" id="final" hidden>
    <div id="dos"></div>
    <h2>¡<span class="q">M</span>uy bien! Ahora dos niños<br>explican su objeto.</h2>
    <div class="fila">
      <button class="btn riman" id="btnMinuto" type="button">1 minuto</button>
      <div class="reloj" id="reloj" aria-live="polite"></div>
    </div>
  </section>

  <footer class="pie" id="pie">
    <button class="btn chico" id="btnAtras" type="button">Anterior</button>
    <button class="btn riman" id="btnRiman" type="button">¿Riman?</button>
    <div class="respuesta" id="respuesta" hidden></div>
    <button class="btn sig" id="btnSig" type="button" hidden>Siguiente</button>
  </footer>
</div>

    if (e.target && e.target.closest && e.target.closest('input, textarea')) return;
    if ((e.key === ' ' || e.key === 'Enter') && e.target && e.target.closest && e.target.closest('button')) return;   // el botón ya hace su clic
    if (e.key === ' ' || e.key === 'Enter' || e.key === 'PageDown') { e.preventDefault(); if (i < P.length && !revelado) revelar(); else ir(i + 1); }
    else if (e.key === 'ArrowRight') ir(i + 1);
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') ir(i - 1);
  });
  $('#btnPantalla').addEventListener('click', () => {
    try {
      if (document.fullscreenElement) { document.exitFullscreen && document.exitFullscreen().catch(() => {}); }
      else if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen().catch(() => {}); }
    } catch (e) {}
  });
  pintar();
})();
</script>
