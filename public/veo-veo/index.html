* { box-sizing: border-box; }

.punto.hecho { background: var(--borde); }
.punto.actual { background: #FF8FA3; border-color: #E0526E; transform: scale(1.25); }
.punto.reto { border-radius: 4px; }
.punto.estrella { border-radius: 4px; transform: rotate(45deg); }
.iconos { display: flex; gap: 10px; }
.icono { width: 52px; height: 52px; border-radius: 16px; border: 4px solid var(--borde); background: var(--tarjeta); display: grid; place-items: center; box-shadow: var(--sombra); color: inherit; text-decoration: none; }
.icono svg { width: 24px; height: 24px; }

.escena { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); gap: clamp(10px, 2.5vw, 34px); align-items: center; }
.dibujo { background: var(--tarjeta); border: 6px solid var(--borde); border-radius: 36px; box-shadow: var(--sombra); height: 100%; max-height: 100%; min-height: 0;
  display: grid; place-items: center; padding: clamp(8px, 2vh, 22px); position: relative; }
.dibujo svg { width: min(100%, 52vh); height: auto; aspect-ratio: 1; }
.dibujo .etq { position: absolute; top: 12px; left: 16px; font-size: clamp(14px, 2vh, 18px); background: #FFE0E6; color: #B3261E; border-radius: 999px; padding: 2px 12px; }
.lado { display: flex; flex-direction: column; align-items: center; gap: clamp(10px, 2.4vh, 26px); min-width: 0; }
.letras { display: flex; gap: clamp(8px, 1.6vw, 20px); justify-content: center; flex-wrap: wrap; }
.ficha { position: relative; width: clamp(78px, min(13vw, 22vh), 170px); aspect-ratio: 1; border-radius: 22px; border: 0; background: var(--tarjeta);
  box-shadow: 0 8px 0 var(--sh, #D9C7F5), inset 0 0 0 6px var(--c, #B79CF0); font-size: clamp(56px, min(10vw, 17vh), 132px); line-height: 1; display: grid; place-items: center;
  transition: transform .15s ease, background .2s ease; }
.ficha:active { transform: translateY(4px); }
.ficha .mayus { color: var(--rojo); }
.ficha.cuenta .mayus { color: #FFFFFF; }
.ficha.tapada .mayus { color: transparent; }
.ficha.tapada { background: repeating-linear-gradient(-45deg, #FFFFFF 0 12px, #F6F1FF 12px 24px); color: transparent; }
.ficha.tapada::after { content: "?"; color: var(--c); font-size: .6em; position: absolute; }
.ficha.cuenta { background: var(--c); animation: salta .35s ease; }
.ficha .num { position: absolute; bottom: -46px; left: 50%; transform: translateX(-50%); font-size: clamp(22px, 3.6vh, 34px); width: 1.6em; height: 1.6em; border-radius: 50%; background: var(--tinta); color: #FFF; display: grid; place-items: center; }
@keyframes salta { 40% { transform: translateY(-14px) scale(1.06); } }
.resultado { min-height: clamp(54px, 9vh, 90px); margin-top: 30px; font-size: clamp(26px, 5vh, 52px); text-align: center; }
.resultado .n { display: inline-grid; place-items: center; width: 1.5em; height: 1.5em; border-radius: 50%; background: var(--rojo); color: #FFF; margin-inline: 6px; }

.pie { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 26px; padding: 12px 26px 16px; font-size: clamp(20px, 3.4vh, 34px); box-shadow: 0 6px 0 rgba(0, 0, 0, .18); display: inline-flex; align-items: center; gap: 10px; }
.btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0, 0, 0, .18); }
.btn svg { width: 1em; height: 1em; }
.btn.amarillo { background: #FFD54A; }
.btn.rosa { background: #FF8FA3; }
.btn.verde { background: #8EE3B0; }
.btn.sig { background: var(--lila-osc); color: #FFF; }
.btn.chico { background: var(--tarjeta); border: 4px solid var(--borde); box-shadow: var(--sombra); font-size: clamp(16px, 2.4vh, 22px); padding: 10px 18px 12px; }

.final { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(8px, 2vh, 20px); text-align: center; }

.reloj { font-size: clamp(30px, 6vh, 60px); font-variant-numeric: tabular-nums; min-width: 4ch; }
.fila { display: flex; gap: 14px; align-items: center; justify-content: center; flex-wrap: wrap; }

.escena { grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr); }
.pista { min-width: 0; display: flex; flex-direction: column; gap: clamp(10px, 2vh, 20px); align-items: stretch; }

.respuesta { min-height: clamp(80px, 16vh, 150px); display: grid; place-items: center; text-align: center; font-size: clamp(22px, 4vh, 40px); }

.op { background: var(--tarjeta); border: 6px solid var(--borde); border-radius: 30px; box-shadow: var(--sombra); padding: clamp(6px, 1.4vh, 14px); display: grid; place-items: center; min-height: 0; }

.op.mal { animation: no .4s ease; border-color: #FF8FA3; }
.op.apagada { opacity: .35; }

@keyframes salta { 40% { transform: translateY(-14px) scale(1.04); } }

  .op svg { width: 100%; }

  </footer>
</div>

  let i = 0, resuelta = false, timers = [];
  const $ = (s) => document.querySelector(s);

  let ac = null;
  const audio = () => { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); return ac; } catch (e) { return null; } };
  function tono(f1, f2, ini, dur, vol, tipo) {
    const a = audio(); if (!a) return;
    const t = a.currentTime + ini, o = a.createOscillator(), g = a.createGain();
    o.type = tipo || 'sine'; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
  }
  let voces = [];
  function vozFemenina(vs) {
    const es = (vs || []).filter((x) => /^es/i.test(x.lang));
    const fem = /paulina|ang[eé]lica|marisol|m[oó]nica|soledad|isabela|esperanza|sabina|dalia|helena|laura|elvira|paloma|valentina|ximena|renata|lupe|female|mujer|google español/i;
    const masc = /juan|jorge|diego|carlos|ra[uú]l|pablo|[aá]lvaro|enrique|male\b|hombre/i;
    const mx = (x) => /es[-_](MX|419)/i.test(x.lang), us = (x) => /es[-_]US/i.test(x.lang);
    return es.find((x) => mx(x) && fem.test(x.name)) || es.find((x) => us(x) && fem.test(x.name)) || es.find((x) => fem.test(x.name))
      || es.find((x) => mx(x) && !masc.test(x.name)) || es.find((x) => !masc.test(x.name)) || es[0] || null;
  }
  const cargarVoces = () => { try { voces = window.speechSynthesis ? window.speechSynthesis.getVoices() : []; } catch (e) { voces = []; } };
  cargarVoces(); try { window.speechSynthesis && window.speechSynthesis.addEventListener('voiceschanged', cargarVoces); } catch (e) {}

      const v = vozFemenina(voces); if (v) u.voice = v; s.speak(u);

  const svg = (k) => `<svg viewBox="0 0 200 200" role="img" aria-label="${k}">${DIBUJOS[k]}</svg>`;
  const mezclar = (a) => { const b = a.slice(); for (let k = b.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [b[k], b[j]] = [b[j], b[k]]; } return b; };
  const cap = (w) => w.charAt(0).toUpperCase() + w.slice(1);
  let orden = [];
  function puntos() {
    $('#puntos').innerHTML = RONDAS.map((r, k) => `<span class="punto${r[5] ? ' reto' : ''}${k < i ? ' hecho' : ''}${k === i ? ' actual' : ''}"></span>`).join('')

  }
  function preguntar() {
    const r = RONDAS[i]; if (!r) return;
    $('#globo').classList.add('habla');
    decir(`Veo, veo... algo que empieza con... ${r[2]}`);
    clearTimeout(timers[0]); timers[0] = setTimeout(() => $('#globo').classList.remove('habla'), 3500);
  }
  function pintar() {
    puntos();
    const fin = i >= RONDAS.length;
    $('#escena').hidden = fin; $('#final').hidden = !fin;
    $('#btnOir').hidden = fin; $('#btnSig').hidden = fin;
    $('#btnAtras').hidden = i === 0; $('#btnAtras').textContent = fin ? 'Volver' : 'Anterior';
    if (fin) { $('#todas').innerHTML = RONDAS.map((r) => svg(r[0])).join(''); return; }
    const r = RONDAS[i]; resuelta = false;
    orden = mezclar([r[0], ...r[4]]);
    $('#son').textContent = r[1];
    $('#respuesta').innerHTML = r[5] ? '<span class="mas">Reto</span>' : '';

  }
  function elegir(btn) {
    if (resuelta) return; audio();
    const r = RONDAS[i], k = btn.dataset.k;
    if (k === r[0]) {

      document.querySelectorAll('.op').forEach((o) => { if (o !== btn) o.classList.add('apagada'); });

      $('#respuesta').innerHTML = `<div><span class="grande"><span class="q">${cap(r[0]).charAt(0)}</span>${r[0].slice(1)}</span>`

      decir(`¡Sí! ${r[0]}. ${cap(r[0])} empieza con ${r[2]}. ¿Qué más hay en el salón que empiece así?`);
    } else {
      btn.classList.remove('mal'); void btn.offsetWidth; btn.classList.add('mal');
      tono(300, 200, 0, 0.25, 0.18, 'triangle');
      decir(`${k}... no. Escucha otra vez: ${r[2]}`);
    }
  }
  function ir(n) { i = Math.max(0, Math.min(RONDAS.length, n)); parar(); pintar(); if (i < RONDAS.length) preguntar(); }

  let tReloj = 0;
  function parar() { clearInterval(tReloj); $('#reloj').textContent = ''; $('#btnMinuto').textContent = '1 minuto'; }
  $('#btnMinuto').addEventListener('click', () => {
    audio(); clearInterval(tReloj); let s = 60; $('#reloj').textContent = '1:00'; $('#btnMinuto').textContent = 'Otra vez';
    tReloj = setInterval(() => { s--; $('#reloj').textContent = `0:${String(s).padStart(2, '0')}`; if (s <= 0) { clearInterval(tReloj); $('#reloj').textContent = '¡Listo!'; tono(660, 880, 0, 0.4, 0.25); } }, 1000);
