button { font: inherit; color: inherit; cursor: pointer; }

.q { color: var(--rojo); }
.puntos { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.punto { width: 18px; height: 18px; border-radius: 50%; background: var(--tarjeta); border: 3px solid var(--borde); }
.punto.hecho { background: var(--borde); }
.punto.actual { background: #FF8FA3; border-color: #E0526E; transform: scale(1.25); }
.punto.reto { border-radius: 4px; }
.punto.estrella { border-radius: 4px; transform: rotate(45deg); }
.iconos { display: flex; gap: 10px; }
.icono { width: 52px; height: 52px; border-radius: 16px; border: 4px solid var(--borde); background: var(--tarjeta); display: grid; place-items: center; box-shadow: var(--sombra); color: inherit; text-decoration: none; }
.icono svg { width: 24px; height: 24px; }

.escena { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); gap: clamp(10px, 2.5vw, 34px); align-items: center; }
.dibujo { background: var(--tarjeta); border: 6px solid var(--borde); border-radius: 36px; box-shadow: var(--sombra); height: 100%; max-height: 100%; min-height: 0;
  display: grid; place-items: center; padding: clamp(8px, 2vh, 22px); position: relative; }
.dibujo svg { width: min(100%, 52vh); height: auto; aspect-ratio: 1; }
.dibujo .etq { position: absolute; top: 12px; left: 16px; font-size: clamp(14px, 2vh, 18px); background: #FFE0E6; color: #B3261E; border-radius: 999px; padding: 2px 12px; }
.lado { display: flex; flex-direction: column; align-items: center; gap: clamp(10px, 2.4vh, 26px); min-width: 0; }
.letras { display: flex; gap: clamp(8px, 1.6vw, 20px); justify-content: center; flex-wrap: wrap; }
.ficha { position: relative; width: clamp(78px, min(13vw, 22vh), 170px); aspect-ratio: 1; border-radius: 22px; border: 0; background: var(--tarjeta);

.ficha.tapada .mayus { color: transparent; }

.btn.rosa { background: #FF8FA3; }
.btn.verde { background: #8EE3B0; }

.reloj { font-size: clamp(30px, 6vh, 60px); font-variant-numeric: tabular-nums; min-width: 4ch; }
.fila { display: flex; gap: 14px; align-items: center; justify-content: center; flex-wrap: wrap; }

</div>

  const audio = () => { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); return ac; } catch (e) { return null; } };
  function tono(f1, f2, ini, dur, vol, tipo) {
    const a = audio(); if (!a) return;
    const t = a.currentTime + ini, o = a.createOscillator(), g = a.createGain();
    o.type = tipo || 'sine'; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
  }
  let voces = [];
  function vozFemenina(vs) {
    const es = (vs || []).filter((x) => /^es/i.test(x.lang));
    const fem = /paulina|ang[eé]lica|marisol|m[oó]nica|soledad|isabela|esperanza|sabina|dalia|helena|laura|elvira|paloma|valentina|ximena|renata|lupe|female|mujer|google español/i;
    const masc = /juan|jorge|diego|carlos|ra[uú]l|pablo|[aá]lvaro|enrique|male\b|hombre/i;
    const mx = (x) => /es[-_](MX|419)/i.test(x.lang), us = (x) => /es[-_]US/i.test(x.lang);
    return es.find((x) => mx(x) && fem.test(x.name)) || es.find((x) => us(x) && fem.test(x.name)) || es.find((x) => fem.test(x.name))
      || es.find((x) => mx(x) && !masc.test(x.name)) || es.find((x) => !masc.test(x.name)) || es[0] || null;
  }
  const cargarVoces = () => { try { voces = window.speechSynthesis ? window.speechSynthesis.getVoices() : []; } catch (e) { voces = []; } };
  cargarVoces(); try { window.speechSynthesis && window.speechSynthesis.addEventListener('voiceschanged', cargarVoces); } catch (e) {}
  function decir(t, cancelar = true) {
    try {
      const s = window.speechSynthesis; if (!s) return;
      if (cancelar) s.cancel();
      const u = new SpeechSynthesisUtterance(t); u.lang = 'es-MX'; u.rate = 0.8; u.pitch = 1.2;
      const v = vozFemenina(voces); if (v) u.voice = v; s.speak(u);
    } catch (e) {}
  }
  const limpiar = () => { timers.forEach(clearTimeout); timers = []; contando = false; };
  const svg = (k, cls = '') => `<svg viewBox="0 0 200 200" role="img" aria-label="${k}" class="${cls}">${DIBUJOS[k]}</svg>`;

  function puntos() {
    $('#puntos').innerHTML = PALABRAS.map((_, k) => `<span class="punto${k >= BASICAS ? ' reto' : ''}${k < i ? ' hecho' : ''}${k === i ? ' actual' : ''}"></span>`).join('')
      + `<span class="punto estrella${i >= PALABRAS.length ? ' actual' : ''}"></span>`;
  }
  function pintar() {
    puntos();
    const fin = i >= PALABRAS.length;
    $('#escena').hidden = fin; $('#final').hidden = !fin;
    ['#btnOir', '#btnTapar', '#btnContar', '#btnSig'].forEach((s) => { $(s).hidden = fin; });
    $('#btnAtras').hidden = i === 0; $('#btnAtras').textContent = fin ? 'Volver' : 'Anterior';
    if (fin) { $('#todas').innerHTML = PALABRAS.map(([, k]) => svg(k)).join(''); return; }
    const [w, k] = PALABRAS[i];
    $('#dibujo').innerHTML = `${i >= BASICAS ? '<span class="etq">Reto</span>' : ''}${svg(k)}`;
    $('#dibujo').setAttribute('aria-label', `${k}, toca para escuchar`);
    $('#letras').innerHTML = [...w].map((l, n) => { const [c, sh] = COLORES[n % COLORES.length];
      return `<button class="ficha${tapada ? ' tapada' : ''}" type="button" data-n="${n}" style="--c:${c};--sh:${sh}" aria-label="${tapada ? 'letra tapada' : 'letra ' + NOMBRES[l]}">${n === 0 ? `<span class="mayus">${l}</span>` : l.toLowerCase()}</button>`; }).join('');
    $('#resultado').innerHTML = '';
    $('#btnTapar').textContent = tapada ? 'Destapar' : 'Tapar letras';
  }
  function contar() {
    if (contando) return; limpiar(); contando = true; audio();
    const [w, k] = PALABRAS[i], fichas = [...document.querySelectorAll('.ficha')];
    fichas.forEach((f) => { f.classList.remove('cuenta', 'tapada'); f.querySelector('.num') && f.querySelector('.num').remove(); });
    $('#resultado').innerHTML = '';
    try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) {}
    fichas.forEach((f, n) => timers.push(setTimeout(() => {
      f.classList.add('cuenta'); f.insertAdjacentHTML('beforeend', `<span class="num">${n + 1}</span>`);
      tono(440 + n * 110, 520 + n * 110, 0, 0.2, 0.22); decir(String(n + 1));
    }, 300 + n * 1000)));
    timers.push(setTimeout(() => {
      const nombre = k.charAt(0).toUpperCase() + k.slice(1);
      $('#resultado').innerHTML = `${nombre} tiene <span class="n">${w.length}</span> letras`;
      tono(660, 990, 0, 0.35, 0.25); decir(`${nombre} tiene ${NUM[w.length]} letras.`); contando = false;
    }, 300 + fichas.length * 1000));
  }
  function ir(n) { limpiar(); i = Math.max(0, Math.min(PALABRAS.length, n)); tapada = false; parar(); pintar();
    if (i < PALABRAS.length) decir(PALABRAS[i][1]); }

  let tReloj = 0;
  function parar() { clearInterval(tReloj); $('#reloj').textContent = ''; $('#btnMinuto').textContent = '1 minuto'; }
  $('#btnMinuto').addEventListener('click', () => {
    audio(); clearInterval(tReloj); let s = 60; $('#reloj').textContent = '1:00'; $('#btnMinuto').textContent = 'Otra vez';
    tReloj = setInterval(() => { s--; $('#reloj').textContent = `0:${String(s).padStart(2, '0')}`; if (s <= 0) { clearInterval(tReloj); $('#reloj').textContent = '¡Listo!'; tono(660, 880, 0, 0.4, 0.25); } }, 1000);
  });
  $('#dibujo').addEventListener('click', () => { audio(); decir(PALABRAS[i][1]); });
  $('#btnOir').addEventListener('click', () => { audio(); const [w, k] = PALABRAS[i]; decir(`${k}. ${[...w].map((l) => NOMBRES[l]).join(', ')}. ${k}.`); });
  $('#btnContar').addEventListener('click', contar);
  $('#btnTapar').addEventListener('click', () => { limpiar(); tapada = !tapada; pintar(); });
  $('#letras').addEventListener('click', (e) => {
    const f = e.target.closest('.ficha'); if (!f || contando) return; audio();
    const l = PALABRAS[i][0][Number(f.dataset.n)];
    if (f.classList.contains('tapada')) { f.classList.remove('tapada'); f.setAttribute('aria-label', 'letra ' + NOMBRES[l]); tono(520, 780, 0, 0.2, 0.2); }
    decir(NOMBRES[l]);
  });
  $('#btnSig').addEventListener('click', () => ir(i + 1));
  $('#btnAtras').addEventListener('click', () => ir(i - 1));
  document.addEventListener('keydown', (e) => {
    if ((e.key === ' ' || e.key === 'Enter') && e.target && e.target.closest && e.target.closest('button')) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); ir(i + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') ir(i - 1);
  });
  $('#btnPantalla').addEventListener('click', () => {
    try {
      if (document.fullscreenElement) { document.exitFullscreen && document.exitFullscreen().catch(() => {}); }
      else if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen().catch(() => {}); }
    } catch (e) {}
  });
  pintar();
})();
</script>
</body>
</html>
